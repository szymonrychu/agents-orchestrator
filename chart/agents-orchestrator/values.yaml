# Default values for agents-orchestrator.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: harbor.szymonrichert.pl/containers/agents-orchestrator
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# This is for the secrets for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account.
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template.
  name: ""

# The unprivileged <fullname>-agent ServiceAccount (agent pods without Kubernetes access, every Job).
agentServiceAccount:
  # Annotations of the agent ServiceAccount only. Never copied from serviceAccount.annotations, so
  # cloud-identity annotations of the api ServiceAccount cannot reach agent pods.
  annotations: {}

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  # readOnlyRootFilesystem: true

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  port: 80

# Agent-only API port. The api container listens on it (named port "agents") and the
# cluster-internal Service <fullname>-agents exposes it to agent pods. It is never on the
# ingress. Becomes ORCH_AGENT_PORT; ORCH_AGENT_API_URL defaults to the Service DNS name
# and can be overridden through env.
agentApi:
  port: 8001

# Service API port (other microservices). The api container listens on it (named port
# "services", never "http", so the oauth2-proxy injector does not front it) and the
# cluster-internal Service <fullname>-services exposes it. It is never on the ingress.
# Becomes ORCH_SERVICE_PORT. ORCH_SERVICE_TOKENS comes from existingSecret/existingSecretKey,
# or from the chart Secret built from tokenHashes (service name -> sha256 hex of its token;
# each service's values file adds its own key). existingSecret wins when set.
# scopes (ORCH_SERVICE_SCOPES) narrows a service to a list of routes, each "<METHOD> <path
# template>" exactly as in the README service-port list; outside it the service gets 403
# service_scope. A service without an entry keeps every route (the default), an empty list
# denies all, a name without a token fails startup. Example:
#   scopes:
#     agents-vault: ["GET /api/v1/presets", "GET /api/v1/sessions"]
serviceApi:
  port: 8002
  existingSecret: ""
  existingSecretKey: service-tokens
  tokenHashes: {}
  scopes: {}

# The reconciler Role and RoleBinding (namespaced, release namespace only). The Role is
# bound to the <fullname>-reconciler ServiceAccount.
rbac:
  create: true

# Cluster-wide Kubernetes access for opted-in sessions (spec.kube_cluster_access). With enabled
# and rbac.create the reconciler gets a ClusterRole/ClusterRoleBinding <fullname>-kube-cluster-access
# (bind on cluster-admin, clusterrolebindings CRUD) and creates one ClusterRoleBinding to
# cluster-admin per granted session. A cluster-access session can read every Secret in every
# namespace; rotate what it could read when discarding it. Becomes ORCH_KUBE_CLUSTER_ACCESS_ENABLED.
kubeClusterAccess:
  enabled: false

# Namespace-scoped Kubernetes access for opted-in sessions (spec.kube_namespace_access). Only the
# listed namespaces can be granted, and only the listed tiers (read, port-forward, exec, edit,
# admin). Each tier binds a ClusterRole in the target namespace: read -> view, edit -> edit,
# admin -> admin, port-forward -> <fullname>-ns-port-forward, exec -> <fullname>-ns-exec (the
# last two are rendered by this chart). The namespaces must exist before the apply: a RoleBinding
# of the manager ClusterRole is rendered into each. Secrets exposure: exec (reads the env and
# mounted files of every pod), edit and admin (read Secrets) expose the Secrets of the namespace;
# read (view) and port-forward do not. Becomes ORCH_KUBE_NAMESPACE_ACCESS_NAMESPACES,
# ORCH_KUBE_NAMESPACE_ACCESS_TIERS and ORCH_KUBE_NAMESPACE_ACCESS_ROLE_PREFIX.
kubeNamespaceAccess:
  namespaces: []
  tiers: [read, port-forward, exec, edit, admin]

# Docker-in-Docker sidecar for opted-in sessions (spec.docker): a privileged container in the
# agent pod. Empty image = off (sessions with docker: true are refused). The image must be
# pinned by semver tag like docker:27.3.1-dind (never latest or a sha); the render fails otherwise.
docker:
  image: ""
  # Default sizeLimit of the /var/lib/docker emptyDir (exceeding it evicts the pod).
  storage: 30Gi
  cpu:
    request: 500m
    limit: "4"
  memory:
    request: 1Gi
    limit: 8Gi
  ephemeralRequest: 5Gi
  # Caps for spec.docker_storage, docker_cpu and docker_memory.
  maxStorage: 100Gi
  maxCpu: "8"
  maxMemory: 16Gi

# This block is for setting up the ingress for more information can be found here: https://kubernetes.io/docs/concepts/services-networking/ingress/
ingress:
  enabled: false
  className: ""
  annotations: {}
  # Source CIDRs the ingress refuses (rendered as the ingress-nginx denylist annotation when non-empty).
  # Pods egress SNATed as node IPs, so list the cluster node IPs here; see README Security.
  denySourceRanges: []
  # Source CIDRs the ingress admits (rendered as the ingress-nginx allow-list annotation when non-empty).
  allowSourceRanges: []
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
    # - secretName: chart-example-tls
    #   hosts:
    #     - chart-example.local

# The four orchestrator processes, each its own Deployment <fullname>-<component> running
# `orch <component>`. The ingester and reconciler hold advisory locks, so a second replica
# is a hot standby and replicas above 1 are safe. Probes given here replace the defaults;
# the api defaults to /healthz (liveness) and /readyz (readiness), the others to none.
# podAnnotations per component merge over the global podAnnotations (component wins), so a
# sidecar-injecting webhook can target the api pod alone.
components:
  api:
    replicas: 1
    resources: {}
    extraArgs: []
    podAnnotations: {}
    livenessProbe: {}
    readinessProbe: {}
  dispatcher:
    replicas: 1
    resources: {}
    extraArgs: []
    podAnnotations: {}
    livenessProbe: {}
    readinessProbe: {}
  ingester:
    replicas: 1
    resources: {}
    extraArgs: []
    podAnnotations: {}
    livenessProbe: {}
    readinessProbe: {}
  reconciler:
    replicas: 1
    resources: {}
    extraArgs: []
    podAnnotations: {}
    livenessProbe: {}
    readinessProbe: {}

# Must exceed ORCH_SHUTDOWN_GRACE_SECONDS (default 20).
terminationGracePeriodSeconds: 30

# Additional volumes on the output Deployment definition.
volumes: []
  # - name: foo
  #   secret:
  #     secretName: mysecret
  #     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
  # - name: foo
  #   mountPath: "/etc/foo"
  #   readOnly: true

nodeSelector: {}

tolerations: []

affinity: {}

# Extra ORCH_* settings, passed verbatim into the settings ConfigMap. Every key must
# start with ORCH_; anything else fails the render.
env: {}
  # ORCH_LOG_LEVEL: info

# Image of the claude-code-wrapper agent pods the reconciler creates (required,
# becomes ORCH_AGENT_IMAGE).
agentImage: ""

# Usage forwarding from the agent pods to agents-usage. url becomes ORCH_AGENT_USAGE_URL (the
# agents-usage ingest listener, e.g. http://agents-usage:8002, no trailing slash) and secretName becomes
# ORCH_AGENT_USAGE_SECRET: the Secret (key "token") holding the shared ingest token, which the
# agent pods read as env CCW_USAGE_TOKEN. The chart only names the Secret and never holds the
# token. Set both, or neither (forwarding is then off); one without the other fails the render.
# Needs agentImage claude-code-wrapper >= 0.8.0: an older wrapper refuses the usage config
# section. Sessions on another image (spec.image) do not forward.
agentUsage:
  url: ""
  secretName: ""

# Postgres connection. A connection is required: set exactly one of
#   1. cnpg.enabled=true              (the chart creates a CloudNativePG Cluster)
#   2. postgres.existingSecret        (an existing Secret holding a connection URI)
#   3. postgres.url                   (a full URI, stored in the chart Secret)
#   4. postgres.host + user + database (+ password, port, sslmode), composed into a URI
postgres:
  url: ""
  host: ""
  port: 5432
  database: ""
  user: ""
  # Raw password; user and password are URL-escaped when the URI is composed.
  password: ""
  # Empty omits ?sslmode= from the composed URI.
  sslmode: ""
  existingSecret: ""
  existingSecretKey: uri

# Optional CloudNativePG Cluster named <fullname>-db. Its app Secret <fullname>-db-app
# (key uri) feeds ORCH_DATABASE_URL. Requires the CNPG operator and its CRDs.
cnpg:
  enabled: false
  instances: 1
  # Empty uses the operator default image.
  imageName: ""
  database: agents_orchestrator
  owner: agents_orchestrator
  storage:
    size: 10Gi
    storageClass: ""
  walStorage:
    enabled: false
    size: 2Gi
    storageClass: ""
  resources: {}
  # Rendered verbatim as the CloudNativePG Cluster spec.backup when non-empty
  # (barmanObjectStore, retentionPolicy, ...).
  backup: {}

# Key that encrypts stored per-session tokens (ORCH_MASTER_KEY). Set value (stored in
# <fullname>-master-key) or point existingSecret at your own Secret; one is required.
masterKey:
  existingSecret: ""
  existingSecretKey: master-key
  value: ""

# Claude OAuth token the agent pods read. Set token (stored in <fullname>-claude) or
# point existingSecret at a Secret in the release namespace; one is required.
claude:
  existingSecret: ""
  existingSecretKey: CLAUDE_CODE_OAUTH_TOKEN
  token: ""

# Chat upstream of the agent chat relay (/agent/v1/chat on the agent port). url becomes
# ORCH_CHAT_URL; ORCH_CHAT_TOKEN, the bearer the orchestrator sends upstream, comes from
# existingSecret/existingSecretKey, or from the chart Secret <fullname>-chat built from token
# (existingSecret wins). Both are env of the api main container only, always together, never in
# the settings ConfigMap. Set url and a token
# source together, or neither (the relay then answers 503 chat_unconfigured); one without the
# other fails the render.
chat:
  url: ""
  token: ""
  existingSecret: ""
  existingSecretKey: chat-token

# Taskboard upstream of the agent taskboard relay (/agent/v1/tasks on the agent port). url becomes
# ORCH_TASKBOARD_URL (the relay appends /taskboard/api/v1/tasks/...); ORCH_TASKBOARD_TOKEN, the
# bearer the orchestrator sends upstream, comes from existingSecret/existingSecretKey, or from the
# chart Secret <fullname>-taskboard built from token (existingSecret wins). Both are env of the api
# main container only, always together, never in the settings ConfigMap. Set url and a token
# source together, or neither (the relay then answers 503 taskboard_unconfigured); one without the
# other fails the render.
taskboard:
  url: ""
  token: ""
  existingSecret: ""
  existingSecretKey: taskboard-token

# Mindmap upstream of the agent mindmap relay (/agent/v1/mindmap on the agent port) and of the
# mindmap tool group. url becomes ORCH_MINDMAP_URL (the relay appends /mindmap/api/v1/...);
# ORCH_MINDMAP_TOKEN, the bearer sent upstream (the agents-mindmap service listener relay token),
# comes from existingSecret/existingSecretKey, or from the chart Secret <fullname>-mindmap built
# from token (existingSecret wins). Both are env of the api main container only, always together,
# never in the settings ConfigMap. Set url and a token source together, or neither (the relay then
# answers 503 mindmap_unconfigured and sessions get no mindmap tools).
mindmap:
  url: ""
  token: ""
  existingSecret: ""
  existingSecretKey: mindmap-token

# Usage gate upstream (agents-usage service port). url becomes ORCH_USAGE_URL; ORCH_USAGE_TOKEN,
# the service bearer sent upstream, comes from existingSecret/existingSecretKey, or from the chart
# Secret <fullname>-usage built from token (existingSecret wins). Both are env of the api main
# container only, always together, never in the settings ConfigMap. Set url with a token source,
# or neither (the gate is then off and never blocks); one without the other fails the render.
usage:
  url: ""
  token: ""
  existingSecret: ""
  existingSecretKey: usage-token

# agents-vault service listener (preset secret refs). url becomes ORCH_VAULT_URL; ORCH_VAULT_TOKEN,
# the service bearer sent upstream, comes from existingSecret/existingSecretKey, or from the chart
# Secret <fullname>-vault built from token (existingSecret wins). Both are env of the api main
# container only, always together, never in the settings ConfigMap. Set url with a token source,
# or neither (preset refs then answer 503 vault_unavailable); one without the other fails the render.
vault:
  url: ""
  token: ""
  existingSecret: ""
  existingSecretKey: vault-token

# Default usage quota percent (1..100) of a session without its own usage_quota
# (ORCH_USAGE_QUOTA_DEFAULT). A metric gates when its percent reaches the limit.
usageQuotaDefault: 100

# Seconds between two restarts an agent asks for on its own session (ORCH_SELF_RESTART_COOLDOWN_SECONDS).
selfRestartCooldownSeconds: 600

# Superleader admin relay upstreams (/agent/v1/admin/webhooks, /schedules, /chats, /history). Each of
# webhook, schedule, connector and history: url becomes ORCH_<NAME>_URL (the connector's is its agent
# listener, the relay appends /chat/v1/admin; the history one is the agents-history service
# listener); ORCH_<NAME>_TOKEN, the service bearer sent upstream, comes from
# existingSecret/existingSecretKey (default key "token"), or from the chart Secret
# <fullname>-admin-<name> built from token (existingSecret wins). Env of the api main container
# only, always together, never in the settings ConfigMap. Set url with a token source, or neither
# (the relay then answers 503 upstream_unconfigured); one without the other fails the render.
admin:
  webhook:
    url: ""
    token: ""
    existingSecret: ""
    existingSecretKey: token
  schedule:
    url: ""
    token: ""
    existingSecret: ""
    existingSecretKey: token
  connector:
    url: ""
    token: ""
    existingSecret: ""
    existingSecretKey: token
  history:
    url: ""
    token: ""
    existingSecret: ""
    existingSecretKey: token

# Pre-discard settings hook that feeds the session history service (ORCH_DISCARD_HOOK_URL): every
# discard POSTs the session export there before anything is deleted. url becomes
# ORCH_DISCARD_HOOK_URL in the settings ConfigMap (the api reports the hook kind in /meta);
# ORCH_DISCARD_HOOK_TOKEN, the bearer sent with that URL hook only, comes from
# existingSecret/existingSecretKey, or from the chart Secret <fullname>-discard-hook built from token
# (existingSecret wins). The token is env of the reconciler main container only, never in the
# ConfigMap. Set url with a token source, or neither (no settings hook); one without the other
# fails the render.
discardHook:
  url: ""
  token: ""
  existingSecret: ""
  existingSecretKey: token

# Workspace cache: restore and save Jobs that move a capped tar.zst of a session workspace
# to and from any S3-compatible object store. Empty cache.s3.bucket disables the cache and
# renders no ORCH_CACHE_* setting. The access keys reach the reconciler container only
# (the cache Jobs get one presigned URL each, agent pods and the other components none).
cache:
  s3:
    # S3 endpoint URL (http or https); empty uses the AWS endpoint of the region.
    endpoint: ""
    # Signing region; most S3-compatible stores accept the default.
    region: us-east-1
    # Bucket holding the archives; setting it enables the cache and requires existingSecret.
    bucket: ""
    # Key prefix of every archive in the bucket.
    prefix: workspace-cache/
    # Path-style addressing (endpoint/bucket/key) instead of virtual-hosted (bucket.endpoint/key).
    pathStyle: false
    # Verify the endpoint's TLS certificate.
    verifyTls: true
    # Existing Secret in the release namespace holding the access key pair (required with a bucket).
    existingSecret: ""
    # Key of the access key id in existingSecret.
    accessKeyIdKey: AWS_ACCESS_KEY_ID
    # Key of the secret access key in existingSecret.
    secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
    # The api pod's own key pair, for the archives list, download, cleanup preview and delete
    # routes, read from its own Secret reference by the api container only. The orchestrator code
    # uses it for list, get and delete only (never a put). It may name the same Secret as
    # existingSecret when the store has a single identity (least privilege is then enforced in
    # code, not by the store); a separate store identity is the stronger setup. Empty leaves those
    # routes answering 503 and renders no ORCH_CACHE_S3_API_* variable.
    api:
      existingSecret: ""
      accessKeyIdKey: AWS_ACCESS_KEY_ID
      secretAccessKeyKey: AWS_SECRET_ACCESS_KEY
  # Image of the cache Jobs; empty uses the chart's own image (image.repository:image.tag,
  # the tag defaulting to the chart appVersion).
  image: ""
  # Largest archive in bytes the Jobs pack or unpack (at most 5 GiB).
  maxBytes: 5368709120
  # Deadline of one cache Job in seconds (60 to 86400).
  timeoutSeconds: 1800
  # Cleanup sweep of stale archives, run by the reconciler. dryRun only plans and logs: set it
  # false after reading the preview (GET /api/v1/cache/cleanup/preview). An archive is deleted
  # only when it is beyond the newest keepNewest of its group, older than retentionDays and than
  # graceSeconds, and referenced by no session. These values are only the seed: they apply until
  # the policy is saved in Settings > Backups, and then the database row wins.
  sweep:
    enabled: true
    dryRun: true
    retentionDays: 30
    keepNewest: 3
    # Seconds between sweeps (at least 60).
    intervalSeconds: 21600
    # Archives younger than this are never deleted; empty means timeoutSeconds + 600.
    graceSeconds: ""
