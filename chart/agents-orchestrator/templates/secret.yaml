{{- $source := include "agents-orchestrator.postgresSource" . }}
{{- if or (eq $source "url") (eq $source "parts") }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-database
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  uri: {{ include "agents-orchestrator.databaseUri" . | quote }}
---
{{- end }}
{{- if and .Values.masterKey.value (not .Values.masterKey.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-orchestrator.masterKeySecretName" . }}
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.masterKey.existingSecretKey | default "master-key" }}: {{ .Values.masterKey.value | quote }}
---
{{- end }}
{{- if and .Values.serviceApi.tokenHashes (not .Values.serviceApi.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-orchestrator.serviceTokensSecretName" . }}
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.serviceApi.existingSecretKey | default "service-tokens" }}: {{ include "agents-orchestrator.serviceTokensCsv" . | quote }}
---
{{- end }}
{{- if and .Values.claude.token (not .Values.claude.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-orchestrator.claudeSecretName" . }}
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLAUDE_CODE_OAUTH_TOKEN: {{ .Values.claude.token | quote }}
---
{{- end }}
{{- if and .Values.chat.token (not .Values.chat.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-orchestrator.chatSecretName" . }}
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.chat.existingSecretKey | default "chat-token" }}: {{ .Values.chat.token | quote }}
{{- end }}
{{- if and .Values.usage.token (not .Values.usage.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-orchestrator.usageSecretName" . }}
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.usage.existingSecretKey | default "usage-token" }}: {{ .Values.usage.token | quote }}
{{- end }}
{{- range $name := splitList "\n" (include "agents-orchestrator.adminUpstreams" . | trim) }}
{{- $acfg := index ($.Values.admin | default dict) $name | default dict }}
{{- if and $name $acfg.token (not $acfg.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agents-orchestrator.adminSecretName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "agents-orchestrator.labels" $ | nindent 4 }}
type: Opaque
stringData:
  {{ $acfg.existingSecretKey | default "token" }}: {{ $acfg.token | quote }}
{{- end }}
{{- end }}
