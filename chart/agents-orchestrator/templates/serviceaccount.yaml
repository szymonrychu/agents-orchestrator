{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agents-orchestrator.serviceAccountName" . }}
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
# The only identity that reaches the Kubernetes API; bound to the reconciler Role.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-reconciler
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: reconciler
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
---
# The api pod's own identity: it writes the preset variable Secrets (protected variables), so it
# mounts a token, bound to the secrets-only Role in role-api.yaml.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-api
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: true
---
# Unprivileged identity of agent pods without kube_access and of every Job: no binding,
# no token (ORCH_AGENT_SERVICE_ACCOUNT).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-agent
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
  {{- with .Values.agentServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
