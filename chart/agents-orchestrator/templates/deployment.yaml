{{- $cache := .Values.cache.s3 }}
{{- if and $cache.bucket (not $cache.existingSecret) }}
{{- fail "agents-orchestrator: cache.s3.existingSecret is required when cache.s3.bucket is set (the Secret holding the S3 access key pair)" }}
{{- end }}
{{- $cacheApi := $cache.api | default dict }}
{{- $settingsSum := include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
{{- range $component, $cfg := .Values.components }}
{{- $labels := dict "context" $ "component" $component }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agents-orchestrator.fullname" $ }}-{{ $component }}
  labels:
    {{- include "agents-orchestrator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: {{ $cfg.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "agents-orchestrator.componentLabels" $labels | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/settings: {{ $settingsSum }}
        {{- if and $.Values.serviceApi.tokenHashes (not $.Values.serviceApi.existingSecret) }}
        checksum/services-secret: {{ include "agents-orchestrator.serviceTokensCsv" $ | sha256sum }}
        {{- end }}
        {{- if and (eq $component "api") $.Values.chat.token (not $.Values.chat.existingSecret) }}
        checksum/chat-secret: {{ $.Values.chat.token | sha256sum }}
        {{- end }}
        {{- with merge (deepCopy ($cfg.podAnnotations | default dict)) ($.Values.podAnnotations | default dict) }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "agents-orchestrator.labels" $ | nindent 8 }}
        app.kubernetes.io/component: {{ $component }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq $component "reconciler" }}
      serviceAccountName: {{ include "agents-orchestrator.fullname" $ }}-reconciler
      {{- else if eq $component "api" }}
      serviceAccountName: {{ include "agents-orchestrator.fullname" $ }}-api
      {{- else }}
      serviceAccountName: {{ include "agents-orchestrator.serviceAccountName" $ }}
      automountServiceAccountToken: false
      {{- end }}
      terminationGracePeriodSeconds: {{ $.Values.terminationGracePeriodSeconds }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: migrate
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["orch"]
          args: ["migrate"]
          {{- include "agents-orchestrator.env" $ | nindent 10 }}
      containers:
        - name: {{ $component }}
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          command: ["orch"]
          args:
            - {{ $component }}
            {{- range $cfg.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          {{- include "agents-orchestrator.env" $ | nindent 10 }}
          {{- if and (eq $component "reconciler") $cache.bucket }}
            - name: ORCH_CACHE_S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $cache.existingSecret }}
                  key: {{ $cache.accessKeyIdKey | default "AWS_ACCESS_KEY_ID" }}
            - name: ORCH_CACHE_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $cache.existingSecret }}
                  key: {{ $cache.secretAccessKeyKey | default "AWS_SECRET_ACCESS_KEY" }}
          {{- end }}
          {{- if and (eq $component "api") $cache.bucket $cacheApi.existingSecret }}
            - name: ORCH_CACHE_S3_API_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $cacheApi.existingSecret }}
                  key: {{ $cacheApi.accessKeyIdKey | default "AWS_ACCESS_KEY_ID" }}
            - name: ORCH_CACHE_S3_API_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $cacheApi.existingSecret }}
                  key: {{ $cacheApi.secretAccessKeyKey | default "AWS_SECRET_ACCESS_KEY" }}
          {{- end }}
          {{- if eq $component "api" }}
            - name: ORCH_HTTP_PORT
              value: "8000"
            {{- with include "agents-orchestrator.chatEnv" $ }}
            {{- . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
            - name: agents
              containerPort: {{ $.Values.agentApi.port }}
              protocol: TCP
            - name: services
              containerPort: {{ $.Values.serviceApi.port }}
              protocol: TCP
          livenessProbe:
            {{- $cfg.livenessProbe | default (dict "httpGet" (dict "path" "/healthz" "port" "http")) | toYaml | nindent 12 }}
          readinessProbe:
            {{- $cfg.readinessProbe | default (dict "httpGet" (dict "path" "/readyz" "port" "http")) | toYaml | nindent 12 }}
          {{- else }}
          {{- with $cfg.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $cfg.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- end }}
          {{- with $cfg.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $.Values.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
