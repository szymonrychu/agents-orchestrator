{{- if .Values.kubeClusterAccess.legacySharedServiceAccount }}
# transition only, removed by T-55 stage 2: the old shared privileged ServiceAccount and its
# cluster-admin ClusterRoleBinding, kept so running sessions survive until the Replacer rolls them.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-kube-access
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: kube-access
automountServiceAccountToken: false
{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-kube-access
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
    app.kubernetes.io/component: kube-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ include "agents-orchestrator.fullname" . }}-kube-access
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
