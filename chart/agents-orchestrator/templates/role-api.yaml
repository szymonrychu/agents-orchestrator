{{- if .Values.rbac.create }}
# The api writes the Secrets that hold protected variables of presets (write-only, immutable
# versions named by the orchestrator): create, patch (server-side apply) and delete, no get, list
# or watch, in the release namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agents-orchestrator.fullname" . }}-api
subjects:
  - kind: ServiceAccount
    name: {{ include "agents-orchestrator.fullname" . }}-api
    namespace: {{ .Release.Namespace }}
{{- end }}
