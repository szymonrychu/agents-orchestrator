{{- if not .Values.agentImage }}
{{- fail "agents-orchestrator: agentImage is required (the claude-code-wrapper image of the agent pods)" }}
{{- end }}
{{- range $k, $_ := .Values.env }}
{{- if not (hasPrefix "ORCH_" $k) }}
{{- fail (printf "agents-orchestrator: env key %q must start with ORCH_" $k) }}
{{- end }}
{{- end }}
{{- /* Validates Postgres and Secret inputs even when no Deployment includes the env. */ -}}
{{- $_ := include "agents-orchestrator.databaseUrlEnv" . }}
{{- $_ := include "agents-orchestrator.masterKeySecretName" . }}
{{- $claude := include "agents-orchestrator.claudeSecretName" . }}
{{- $_ := include "agents-orchestrator.chatEnabled" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-settings
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
data:
  ORCH_NAMESPACE: {{ .Release.Namespace | quote }}
  ORCH_AGENT_IMAGE: {{ .Values.agentImage | quote }}
  ORCH_CLAUDE_SECRET_NAME: {{ $claude | quote }}
  ORCH_AGENT_PORT: {{ .Values.agentApi.port | toString | quote }}
  ORCH_SERVICE_PORT: {{ .Values.serviceApi.port | toString | quote }}
  ORCH_AGENT_API_URL: {{ include "agents-orchestrator.agentApiUrl" . | quote }}
  ORCH_AGENT_SERVICE_ACCOUNT: {{ ternary (printf "%s-agent" (include "agents-orchestrator.fullname" .)) "default" .Values.serviceAccount.create | quote }}
  {{- if .Values.kubeAccess.enabled }}
  ORCH_KUBE_ACCESS_SERVICE_ACCOUNT: {{ printf "%s-kube-access" (include "agents-orchestrator.fullname" .) | quote }}
  {{- end }}
  {{- with .Values.cache }}
  {{- if .s3.bucket }}
  ORCH_CACHE_S3_ENDPOINT: {{ .s3.endpoint | quote }}
  ORCH_CACHE_S3_REGION: {{ .s3.region | quote }}
  ORCH_CACHE_S3_BUCKET: {{ .s3.bucket | quote }}
  ORCH_CACHE_S3_PREFIX: {{ .s3.prefix | quote }}
  ORCH_CACHE_S3_PATH_STYLE: {{ .s3.pathStyle | toString | quote }}
  ORCH_CACHE_S3_VERIFY_TLS: {{ .s3.verifyTls | toString | quote }}
  ORCH_CACHE_IMAGE: {{ .image | default (printf "%s:%s" $.Values.image.repository ($.Values.image.tag | default $.Chart.AppVersion)) | quote }}
  ORCH_CACHE_MAX_BYTES: {{ .maxBytes | int64 | toString | quote }}
  ORCH_CACHE_TIMEOUT_SECONDS: {{ .timeoutSeconds | int64 | toString | quote }}
  {{- with .sweep }}
  ORCH_CACHE_SWEEP_ENABLED: {{ .enabled | toString | quote }}
  ORCH_CACHE_SWEEP_DRY_RUN: {{ .dryRun | toString | quote }}
  ORCH_CACHE_RETENTION_DAYS: {{ .retentionDays | int64 | toString | quote }}
  ORCH_CACHE_KEEP_NEWEST: {{ .keepNewest | int64 | toString | quote }}
  ORCH_CACHE_SWEEP_INTERVAL_SECONDS: {{ .intervalSeconds | int64 | toString | quote }}
  {{- if ne (toString .graceSeconds) "" }}
  ORCH_CACHE_SWEEP_GRACE_SECONDS: {{ .graceSeconds | int64 | toString | quote }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
  {{- range $k, $v := .Values.env }}
  {{- if ne $k "ORCH_AGENT_API_URL" }}
  {{ $k }}: {{ $v | toString | quote }}
  {{- end }}
  {{- end }}
