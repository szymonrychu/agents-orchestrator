{{- if and .Values.kubeClusterAccess.enabled .Values.rbac.create }}
# The reconciler creates one ClusterRoleBinding to cluster-admin per cluster-access session.
# It may bind only cluster-admin, so it cannot hand out anything broader.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-kube-cluster-access
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    verbs: ["bind"]
    resourceNames: ["cluster-admin"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "agents-orchestrator.fullname" . }}-kube-cluster-access
  labels:
    {{- include "agents-orchestrator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "agents-orchestrator.fullname" . }}-kube-cluster-access
subjects:
  - kind: ServiceAccount
    name: {{ include "agents-orchestrator.fullname" . }}-reconciler
    namespace: {{ .Release.Namespace }}
{{- end }}
