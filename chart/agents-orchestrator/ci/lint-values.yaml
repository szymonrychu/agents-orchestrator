# Minimal values that make the full chart render; used by helm lint and CI.
agentImage: harbor.szymonrichert.pl/containers/claude-code-wrapper:dev
postgres:
  url: postgresql://orchestrator:orchestrator@postgres:5432/orchestrator
masterKey:
  value: lint-master-key
claude:
  token: lint-claude-token
cache:
  s3:
    endpoint: https://s3.example.com
    bucket: lint-cache
    pathStyle: true
    existingSecret: lint-cache-credentials
kubeClusterAccess:
  enabled: true
  legacySharedServiceAccount: true
kubeNamespaceAccess:
  namespaces: [media, games]
  tiers: [read, port-forward, exec, edit, admin]
