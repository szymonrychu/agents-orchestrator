# Chart values for the kind e2e (scripts/e2e.sh). Both images are built locally and loaded
# into the kind node, so nothing is pulled from Harbor and there is no regcred.
image:
  repository: agents-orchestrator
  tag: e2e
  pullPolicy: Never

agentImage: agents-orchestrator-agent-test:e2e

# Docker-in-Docker sidecar for the docker e2e: scripts/e2e.sh pulls this image on the host and
# loads it into the kind node (no Harbor login, no pull secret, no registry mirror).
docker:
  image: docker:27.3.1-dind
  # small request: the single-node kind on a 4 vCPU CI runner cannot fit the dind sidecar
  # (default 500m) beside the session pods other e2e tests leave running
  cpu:
    request: 50m
    limit: "4"

# postgres.url, masterKey.value and claude.token are generated per run by scripts/e2e.sh and
# passed with --set-string at install time (no secret-shaped literal lives in the repo). The
# test agent image runs the wrapper's fake claude, which never reads the claude token.

env:
  # kubectl port-forward connects from loopback inside the api pod; every pod-network
  # caller (agent pods, check Jobs, any other pod) is refused with 403 forbidden.
  ORCH_ALLOWED_CIDRS: "127.0.0.0/8"
  # The e2e port-forward is the only browser-facing origin; WebSocket upgrades from any other
  # origin are refused with 1008.
  ORCH_ALLOWED_ORIGINS: http://127.0.0.1:18080,http://localhost:18080
  # the roll-mid-turn e2e upgrades the release to the second tag of the same image
  ORCH_AGENT_IMAGES: agents-orchestrator-agent-test:e2e,agents-orchestrator-agent-test:e2e-next
  ORCH_IMAGE_PULL_SECRET: ""
  # scripts/e2e.sh probes which RWX StorageClass works and overrides this when it falls
  # back to the hostPath one.
  ORCH_PVC_STORAGE_CLASS: e2e-rwx
  ORCH_PVC_SIZE: 1Gi
  # the single node of a 4 vCPU CI runner must fit every concurrent session pod: the default
  # 500m request starved the docker e2e's init Job pod (FailedScheduling: Insufficient cpu)
  ORCH_DEFAULT_CPU_REQUEST: 50m
  ORCH_RETRY_BACKOFF_BASE_SECONDS: "0.5"
  ORCH_RETRY_BACKOFF_MAX_SECONDS: "2"
  ORCH_RECONCILE_POLL_SECONDS: "3"
  # the autoclose e2e uses the smallest accepted window (the production default is higher)
  ORCH_AUTOCLOSE_MIN_SECONDS: "30"
  ORCH_LOG_LEVEL: INFO

# Service port (other microservices): the e2e pod presents the fixed, non-secret token
# "e2e-service-token-not-a-secret"; only its sha256 lives here.
serviceApi:
  tokenHashes:
    e2e: d0c4480135ce7e2d8c3b4ae32acd5022a90d9c34b66738d8ea6807d324da401f
