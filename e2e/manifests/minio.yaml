# A throwaway S3 store for the backup e2e (scripts/e2e.sh applies it into namespace agents).
# e2e/values-kind.yaml points cache.s3 at the Service below; the bucket `orch-e2e` is a
# directory created before the server starts. The root key pair comes from the Secret
# minio-credentials (generated per run), which is also the chart's cache.s3.existingSecret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: agents-orchestrator-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/part-of: agents-orchestrator-e2e
    spec:
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
          command: ["/bin/sh", "-c", "mkdir -p /data/orch-e2e && exec minio server /data --address :9000"]
          ports:
            - name: s3
              containerPort: 9000
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: minio-credentials, key: AWS_ACCESS_KEY_ID}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: minio-credentials, key: AWS_SECRET_ACCESS_KEY}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/part-of: agents-orchestrator-e2e
spec:
  selector:
    app.kubernetes.io/name: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
