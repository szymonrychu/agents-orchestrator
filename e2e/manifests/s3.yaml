# A throwaway S3 store for the backup e2e (scripts/e2e.sh applies it into namespace agents and
# creates the bucket `orch-e2e`). moto's server speaks the S3 API (put, get, list, copy and
# presigned URLs; it does not verify signatures). e2e/values-kind.yaml points cache.s3 at the
# Service below; the key pair is the Secret s3-credentials (generated per run), which is also
# the chart's cache.s3.existingSecret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3
  labels:
    app.kubernetes.io/name: s3
    app.kubernetes.io/part-of: agents-orchestrator-e2e
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: s3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3
        app.kubernetes.io/part-of: agents-orchestrator-e2e
    spec:
      containers:
        - name: s3
          image: motoserver/moto:5.0.28
          ports:
            - name: s3
              containerPort: 5000
          readinessProbe:
            tcpSocket: {port: s3}
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  labels:
    app.kubernetes.io/name: s3
    app.kubernetes.io/part-of: agents-orchestrator-e2e
spec:
  selector:
    app.kubernetes.io/name: s3
  ports:
    - name: s3
      port: 5000
      targetPort: s3
