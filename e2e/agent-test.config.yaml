# claude-code-wrapper config for the orchestrator test image (e2e/agent-test.Dockerfile).
# claude.binary is the wrapper's scripted fake claude, so no credentials are needed. The same
# image is used by the contract suite (tests/fakes/real_wrapper.py) and by kind-e2e.
server:
  host: 0.0.0.0
  port: 8080
  internal_port: 8090
  auth_token: ${CCW_AUTH_TOKEN:-ci-token}
  callback_secret: ci-callback-secret

paths:
  workdir_root: /workdir
  sessions_root: /sessions

claude:
  binary: /opt/agent-test/claude
  env:
    extra:
      FAKE_CLAUDE_SCENARIO: /opt/agent-test/scenario.json
  boot:
    timeout_seconds: 60
    min_boot_seconds: 0.5
    idle_ready_seconds: 30.0
    submit_delay_seconds: 0.4
    dialogs:
      - {pattern: "Bypass Permissions mode", keys: ["\u001b[B", "\r"], delay_seconds: 0.6}
      - {pattern: "Do you trust the files in this folder", keys: ["\r"]}
    ready_markers: ["? for shortcuts", "bypass permissions on"]

mise:
  install_on_start: false
  install_workdir: false
  required: false

# The orchestrator renders its own config for the sessions it runs (notes.enabled follows the hive
# flag); this file is for the contract suite and a lone image run, so notes are on here too.
notes:
  enabled: true

sessions:
  max_sessions: 8
  # The contract suite's real leg sends any slash command name through the client route.
  commands:
    client: ["*"]
