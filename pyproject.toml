[project]
name = "agents-orchestrator"
version = "0.1.0"
description = "Web UI and headless API that define, run, message and discard sessions of claude-code-wrapper pods"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.160.0",
    "uvicorn[standard]",
    "psycopg[binary,pool]==3.3.6",
    "httpx",
    "lightkube==1.0.1",
    "pydantic",
    "pydantic-settings",
    "pyyaml",
    "websockets>=17.3",
    "any-mcp @ git+https://github.com/szymonrychu/any-mcp@v0.5.0",
    "zstandard>=0.25.0",
    "botocore>=1.43.118",
]

[project.scripts]
orch = "agents_orchestrator.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "testcontainers[postgres]",
    "ruff",
    "claude-code-wrapper @ git+https://github.com/szymonrychu/claude-code-wrapper@cdc786ac45ece51edc2300907c9579b2ed9fdc4b",
    "moto[server]>=5.2.4",
    "any-mcp-tatara-orchestrator @ git+https://github.com/szymonrychu/any-mcp-tatara-plugins@v0.5.1#subdirectory=orchestration/orchestrator",
]

[tool.uv]
# uv refuses the plugins repo workspace's own any-mcp source as a conflicting URL, even at the
# same tag; keep every resolution on the any-mcp ref pinned in [project].dependencies above.
override-dependencies = ["any-mcp @ git+https://github.com/szymonrychu/any-mcp@v0.5.0"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_orchestrator"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
asyncio_mode = "auto"
markers = [
    "integration: needs a real wrapper image",
    "e2e: needs kind",
]
addopts = "-q -m 'not integration and not e2e'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
